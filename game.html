<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/midi-hero/vite.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta https-equiv="Content-Security-Policy" content="default-src *;"/>

    <title>MIDI HERO</title>

  <script type="module" crossorigin src="/midi-hero/assets/game-DtrZpETU.js"></script>
  <link rel="modulepreload" crossorigin href="/midi-hero/assets/songLoader-DIAPcGLO.js">
  <link rel="stylesheet" crossorigin href="/midi-hero/assets/game-DAbR2ilk.css">
</head>
<body>
<div id="app"></div>
<div id="failFlash"></div>
<div class="header">
    <button class="header-btn" onclick="window.open('/midi-hero/marketplace.html')">&larr; Marketplace</button>
    <audio id="audioPlayer"></audio>
    <div class="controls">
        <label><span>Delay</span><input type="range" min="-1.0" max="0.5" value="0" step="0.001" id="timeOffset"/></label>
        <label><span>Easyculty</span><input type="range" min="0.03" max="0.1" value="0.05" step="0.01" id="hitTime"/></label>
        <label><span>BG</span><input type="range" min="0.03" max="0.75" value="0.5" step="0.01" id="visibility"/></label>
        <label><span>Vol</span><input type="range" min="0" max="1" value="0.5" step="0.01" id="volume"/></label>
    </div>
</div>

<div id="startOverlay" class="overlay">
    <div class="panel">
        <img id="startCover" alt=""/>
        <div class="info">
            <h1 id="startTitle"></h1>
            <h2 id="startAuthor"></h2>
            <div class="meta">
                <span id="startDiff"></span>
                <span id="startBpm"></span>
                <span id="startDuration"></span>
                <span id="startNps"></span>
            </div>
            <p class="hint">Press <kbd>Space</kbd> or click anywhere to start</p>
        </div>
    </div>
</div>

<div id="endOverlay" class="overlay hidden">
    <div class="panel">
        <h1>Song complete</h1>
        <div class="stats">
            <div><span>Score</span><strong id="endScore"></strong></div>
            <div><span>Accuracy</span><strong id="endAccuracy"></strong></div>
            <div><span>Max combo</span><strong id="endMaxCombo"></strong></div>
            <div><span>Hits</span><strong id="endHits"></strong></div>
            <div><span>Fails</span><strong id="endFails"></strong></div>
        </div>
        <div class="actions">
            <button id="endReplay">Play again</button>
            <button id="endBack">Marketplace</button>
        </div>
    </div>
</div>
</body>
</html>
